name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build bakes these in; CI only needs them present, not real.
      VITE_FIREBASE_API_KEY: ci
      VITE_FIREBASE_AUTH_DOMAIN: ci.example
      VITE_FIREBASE_PROJECT_ID: ci
      VITE_FIREBASE_APP_ID: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Includes the layer boundary: src/core may not import React, storage or the app.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
